<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web App Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }

        .calculator {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        h1 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        button {
            padding: 15px;
            border: none;
            border-radius: 7px;
            background: #232f3e;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        #result {
            margin-top: 25px;
            font-size: 24px;
            font-weight: bold;
        }

        #error {
            margin-top: 15px;
            color: red;
        }
    </style>
</head>

<body>

<div class="calculator">

    <h1>Calculator</h1>

    <input
        type="number"
        id="number1"
        placeholder="Enter first number"
        step="any"
    >

    <input
        type="number"
        id="number2"
        placeholder="Enter second number"
        step="any"
    >

    <div class="buttons">

        <button onclick="calculate('add')">
            +
        </button>

        <button onclick="calculate('subtract')">
            −
        </button>

        <button onclick="calculate('multiply')">
            ×
        </button>

        <button onclick="calculate('divide')">
            ÷
        </button>

    </div>

    <div id="result"></div>
    <div id="error"></div>

</div>


<script>

    const API_URL =
        "https://0k86i8xhyk.execute-api.us-east-1.amazonaws.com/dev/calculate";


    async function calculate(operation) {

        const number1 =
            document.getElementById("number1").value;

        const number2 =
            document.getElementById("number2").value;

        const resultElement =
            document.getElementById("result");

        const errorElement =
            document.getElementById("error");


        resultElement.textContent = "";
        errorElement.textContent = "";


        if (number1 === "" || number2 === "") {

            errorElement.textContent =
                "Please enter both numbers.";

            return;
        }


        resultElement.textContent =
            "Calculating...";


        try {

            const response = await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        number1: Number(number1),
                        number2: Number(number2),
                        operation: operation
                    })
                }
            );


            const data = await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error || "Calculation failed."
                );
            }


            let symbol = "";

            if (operation === "add") symbol = "+";
            if (operation === "subtract") symbol = "−";
            if (operation === "multiply") symbol = "×";
            if (operation === "divide") symbol = "÷";


            resultElement.textContent =
                `${number1} ${symbol} ${number2} = ${data.result}`;

        }

        catch (error) {

            resultElement.textContent = "";

            errorElement.textContent =
                error.message;
        }
    }

</script>

</body>

</html>
