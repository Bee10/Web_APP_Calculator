<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web App Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }

        .calculator {
            width: 90%;
            max-width: 450px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 6px;
            background: #232f3e;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #result {
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
        }

        #error {
            margin-top: 15px;
            color: red;
        }
    </style>
</head>


<body>

    <div class="calculator">

        <h1>To the Power of Math!</h1>

        <p>Enter a base number and exponent.</p>

        <input
            type="number"
            id="base"
            placeholder="Enter base number"
        >

        <input
            type="number"
            id="exponent"
            placeholder="Enter exponent"
        >

        <button onclick="calculate()">
            Calculate
        </button>

        <div id="result"></div>

        <div id="error"></div>

    </div>


    <script>

        const API_URL =
            "https://0k86i8xhyk.execute-api.us-east-1.amazonaws.com/dev/calculate";


        async function calculate() {

            const base =
                document.getElementById("base").value;

            const exponent =
                document.getElementById("exponent").value;

            const resultElement =
                document.getElementById("result");

            const errorElement =
                document.getElementById("error");


            resultElement.textContent = "";
            errorElement.textContent = "";


            if (base === "" || exponent === "") {

                errorElement.textContent =
                    "Please enter both numbers.";

                return;
            }


            resultElement.textContent =
                "Calculating...";


            try {

                const response = await fetch(
                    API_URL,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            base: Number(base),
                            exponent: Number(exponent)
                        })
                    }
                );


                const data = await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error || "Calculation failed."
                    );
                }


                resultElement.textContent =
                    `${base} ^ ${exponent} = ${data.result}`;

            }

            catch (error) {

                resultElement.textContent = "";

                errorElement.textContent =
                    "Error: " + error.message;
            }

        }

    </script>

</body>

</html>
