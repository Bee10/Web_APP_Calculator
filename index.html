<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MDS615 Cloud Computing - Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef2f7, #dbe5f1);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
        }

        .main-heading {
            text-align: center;
            margin-bottom: 40px;
            color: #1f2937;
            font-size: 32px;
            font-weight: 700;
        }

        .calculator {
            position: relative;
            width: 100%;
            max-width: 620px;
            background: white;
            border-radius: 18px;
            padding: 40px 40px 65px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        .calculator-title {
            text-align: center;
            font-size: 26px;
            color: #232f3e;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .calculation-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        input,
        select {
            height: 55px;
            border: 2px solid #d1d5db;
            border-radius: 10px;
            font-size: 20px;
            text-align: center;
            background: #f9fafb;
            outline: none;
        }

        input {
            width: 180px;
        }

        select {
            width: 90px;
            cursor: pointer;
            font-weight: bold;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
            background: white;
        }

        .execute-button {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 25px;
            border: none;
            border-radius: 10px;
            background: #232f3e;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .execute-button:hover {
            background: #37475a;
            transform: translateY(-1px);
        }

        .result-box {
            margin-top: 25px;
            min-height: 70px;
            border-radius: 10px;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        #result {
            margin: 0;
            font-size: 25px;
            font-weight: bold;
            color: #111827;
            text-align: center;
        }

        #error {
            margin-top: 15px;
            text-align: center;
            color: #dc2626;
            font-weight: bold;
        }

        .student-info {
            position: absolute;
            bottom: 18px;
            right: 25px;
            font-size: 13px;
            color: #6b7280;
            font-style: italic;
        }

        @media (max-width: 600px) {

            .main-heading {
                font-size: 24px;
            }

            .calculator {
                padding: 30px 20px 65px;
            }

            .calculation-row {
                gap: 7px;
            }

            input {
                width: 110px;
                font-size: 17px;
            }

            select {
                width: 70px;
                font-size: 18px;
            }
        }
    </style>

</head>

<body>

    <h1 class="main-heading">
        Welcome to 2nd Assessment of MDS615 Cloud_Computing
    </h1>


    <div class="calculator">

        <h2 class="calculator-title">
            AWS Web Calculator
        </h2>

        <p class="description">
            Enter two numbers, select an operation and click Execute.
        </p>


        <div class="calculation-row">

            <input
                type="number"
                id="number1"
                placeholder="5"
                step="any"
            >


            <select id="operation">

                <option value="add">+</option>

                <option value="subtract">−</option>

                <option value="multiply">×</option>

                <option value="divide">÷</option>

            </select>


            <input
                type="number"
                id="number2"
                placeholder="5"
                step="any"
            >

        </div>


        <button
            class="execute-button"
            onclick="calculate()"
        >
            Execute
        </button>


        <div class="result-box">

            <p id="result">
                Result will appear here
            </p>

        </div>


        <div id="error"></div>


        <div class="student-info">
            by Birendra Bista SPI250165
        </div>

    </div>


    <script>

        const API_URL =
            "https://0k86i8xhyk.execute-api.us-east-1.amazonaws.com/dev/calculate";


        async function calculate() {

            const number1 =
                document.getElementById("number1").value;

            const number2 =
                document.getElementById("number2").value;

            const operation =
                document.getElementById("operation").value;

            const resultElement =
                document.getElementById("result");

            const errorElement =
                document.getElementById("error");


            errorElement.textContent = "";


            if (number1 === "" || number2 === "") {

                resultElement.textContent =
                    "Result will appear here";

                errorElement.textContent =
                    "Please enter both numbers.";

                return;
            }


            resultElement.textContent =
                "Executing calculation...";


            try {

                const response = await fetch(
                    API_URL,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            number1: Number(number1),

                            number2: Number(number2),

                            operation: operation

                        })
                    }
                );


                const data = await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error || "Calculation failed."
                    );
                }


                let symbol = "";

                if (operation === "add") {
                    symbol = "+";
                }

                else if (operation === "subtract") {
                    symbol = "−";
                }

                else if (operation === "multiply") {
                    symbol = "×";
                }

                else if (operation === "divide") {
                    symbol = "÷";
                }


                resultElement.textContent =
                    `${number1} ${symbol} ${number2} = ${data.result}`;

            }

            catch (error) {

                resultElement.textContent =
                    "Unable to calculate";

                errorElement.textContent =
                    error.message;

            }

        }

    </script>

</body>

</html>
